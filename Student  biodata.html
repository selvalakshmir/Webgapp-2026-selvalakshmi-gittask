<!DOCTYPE html>
<html>
    <head>
        <title>Student Biodata</title>
        <h3>
            Student biodata form
        </h3>
        <form>
            <label for="fname">First Name</label><br>
            <input type="fname" id="fname"><br>

            <label for="lname">last Name</label><br>
            <input type="lname" id="lname"><br>

            <label for="DOB">Date of Birth</label><br>
            <input type="date" id="DOB"><br>

            <label for="password">PassWord</label><br>
            <input type="password" id="password"><br>

            <label for="email">Email</label><br>
            <input type="email" id="email"><br>

            <label for="address">Address</label><br>
            <input type="textarea" id="textarea"><br> 

            <label for="bloodgroup">Bloodgroup</label><br>
            <input type="text" id="text"><br>

            <label for="gender">Gender</label><br>
            <input type="radio" name="gender" value="Male">Male<br>
            <input type="radio" name="gender" value="Female">Female<br>
            <input type="radio" name="gender" value="others">others<br>

            <label for="language">Language</label><br>
            <input type="checkbox" name="language" value="Tamil">Tamil<br>
            <input type="checkbox" name="language" value="English">English<br>
            <input type="checkbox" name="language" value="Hindi">Hindi<br>

            <label for="skills">skills</label><br>
            <input type="checkbox" name="language" value="C">C<br>
            <input type="checkbox" name="language" value="C++">C++<br>
            <input type="checkbox" name="language" value="Python">python<br>

            


        </form>
